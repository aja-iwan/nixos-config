scale = 1.0500000081956387

[osd]
background_opacity = 0.79999998211860657
offset_x = 16
position = "bottom_left"
position_vertical = "bottom_left"
scale = 1.0500000081956387

[shell]
avatar_path = "/home/iwan/Pictures/citlali.png"
font_family = "JetBrainsMono Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    pinned = [
        "brave-browser",
        "kitty",
        "org.gnome.Nautilus",
        "code",
        "Waydroid",
        "org.vinegarhq.Sober",
        "md.obsidian.Obsidian",
        "dev.zed.Zed"
    ]

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    list_item_background = true
    transparency_mode = "glass"

    [shell.session]
    grid = true
    grid_columns = 1

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Lavender"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/iwan/nixos/configuration/modules/wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/iwan/nixos/configuration/modules/wallpapers/dominik-mayer.jpg"

    [wallpaper.last]
    path = "/home/iwan/nixos/configuration/modules/wallpapers/dominik-mayer.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/iwan/nixos/configuration/modules/wallpapers/dominik-mayer.jpg"

[widget.launcher]
color = "primary"
icon_color = "primary"

[widget.network]
show_label = false

[widget.session]
color = "error"
icon_color = "error"

[widget.sysmon]
network_speed_compact = true
network_speed_unit = "kb"
show_value = false

[widget.volume]
show_label = false

[widget.workspaces]
empty_color = "tertiary"
