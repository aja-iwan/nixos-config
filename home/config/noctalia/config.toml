[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
blur_intensity = 0.29999999329447746
enabled = true
tint_intensity = 0.19999999552965164

[bar.default]
background_opacity = 0.69999998435378075
capsule = true
capsule_border = "on_primary"
capsule_opacity = 0.79999998211860657
capsule_padding = 8.0
capsule_thickness = 0.79999998584389687
