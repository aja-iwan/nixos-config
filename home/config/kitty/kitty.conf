font_family  JetBrainsMono Nerd Font
bold_font    auto
italic_font  auto
font_size    12.0

cursor_trail 1

window_padding_width  2 2
background_opacity    0.7
background_blur       1

confirm_os_window_close 0

map ctrl+z discard_event
map ctrl+shift+z discard_event

map ctrl+q no_op
map ctrl+shift+q no_op

include tokyonight.conf
