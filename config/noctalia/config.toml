[shell]
avatar_path = "/home/iwan/Pictures/citlali.png"
clipboard_auto_paste = "off"
font_family = "JetBrainsMono Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_expand_all_groups = true
settings_window_translucent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    pinned = [ "brave-browser", "kitty", "org.gnome.Nautilus", "android-studio", "Waydroid", "org.vinegarhq.Sober" ]

    [shell.panel]
    clipboard_placement = "floating"
    clipboard_position = "auto"
    control_center_placement = "floating"
    floating_layer = "top"
    launcher_placement = "floating"
    list_item_background = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.session]
    grid = false
    grid_columns = 3

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Lavender"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "~/nixos/modules/wallpapers"
edge_smoothness = 0.099999997764825821
transition_duration = 1000
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/iwan/nixos/modules/wallpapers/dark-forest.jpg"

    [wallpaper.last]
    path = "/home/iwan/nixos/modules/wallpapers/dark-forest.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/iwan/nixos/modules/wallpapers/dark-forest.jpg"

[widget.launcher]
color = "primary"
icon_color = "primary"

[widget.media]
max_length = 120

[widget.network]
show_label = false

[widget.session]
color = "error"
icon_color = "error"

[widget.sysmon]
network_speed_compact = true
network_speed_unit = "kb"
show_value = false

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.0
empty_color = "tertiary"
